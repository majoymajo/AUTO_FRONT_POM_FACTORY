name: E2E Tests — POM Page Factory

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'

jobs:
  e2e-tests:
    name: Run E2E Cucumber Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'stable'

      - name: Start Frontend (Sofkianos MVP)
        run: |
          echo "⚠️ The frontend must be available at localhost:5173"
          echo "In CI, start the app via docker-compose or a mock server before this step."
          echo "Skipping frontend start — configure this step for your environment."

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run E2E Tests
        run: ./gradlew test --no-daemon
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: Upload Cucumber HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-e2e-report
          path: build/reports/cucumber-report.html
          retention-days: 30

      - name: Upload JUnit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: build/test-results/test/
          retention-days: 30

      - name: Publish Test Summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: build/test-results/test/*.xml
