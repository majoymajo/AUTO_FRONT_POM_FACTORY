name: Frontend CI/CD─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
    paths:
      - "frontend/**"
      - "pom-pagefactory/**"
      - ".github/workflows/frontend.yml"
      - "!**/*.md"
      - "!**/*.txt"
      - "!**/*.pdf"
      - "!**/*.png"
      - "!**/*.jpg"
      - "!**/*.jpeg"
      - "!**/*.gif"
      - "!**/*.svg"
      - "!**/*.log"

  pull_request:
    branches:
      - main
      - develop
      - "feature/**"
    paths:
      - "frontend/**"
      - "pom-pagefactory/**"
      - ".github/workflows/frontend.yml"
      # ── Exclude documentation / non-code files ──
      - "!**/*.md"
      - "!**/*.txt"
      - "!**/*.pdf"
      - "!**/*.png"
      - "!**/*.jpg"
      - "!**/*.jpeg"
      - "!**/*.gif"
      - "!**/*.svg"
      - "!**/*.log"

# ──────────────────────────────────────────────────────────────────────────────
# GLOBAL ENVIRONMENT VARIABLES
# ──────────────────────────────────────────────────────────────────────────────
env:
  NODE_VERSION: '20'
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USER }}/sofkianos-frontend

jobs:
  

  # ========================================================================
  # JOB 1 — TEST & LINT
  # ========================================================================
  # Runs ESLint for code quality and Vitest for unit tests.
  # If ANY check fails the workflow stops → merge is blocked
  # (when branch protection rules require this check to pass).
  # ========================================================================
  test:
    name: "🧪 Frontend Unit & Integration Tests"
    runs-on: ubuntu-latest
    
    # ──────────────────────────────────────────────────────────────────────────────
    # PERMISSIONS
    # ──────────────────────────────────────────────────────────────────────────────
    # Required for creating issues automatically from ESLint results
    permissions:
      contents: read       # Read repository code
      issues: write        # Create and update issues
      pull-requests: read  # Read PR info (optional)

    steps:
      # -- Checkout source code -----------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # -- Setup Node.js with npm dependency caching -------------------------
      # Caches the npm store to avoid re-downloading dependencies each run.
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # -- Install exact dependency versions from lockfile --------------------
      # `npm ci` is faster than `npm install` and guarantees reproducibility.
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      # -- Scan npm dependencies for known vulnerabilities (US-004) -----------
      # Runs `npm audit` to detect CVEs in the dependency tree.
      #   1. JSON report is saved for automated processing and archival
      #   2. Human-readable table is printed to the workflow log
      # Severity threshold: CRITICAL and HIGH block the pipeline.
      # Moderate/low findings are reported but do not fail the build.
      - name: Dependency Vulnerability Scan (npm audit)
        working-directory: ./frontend
        run: |
          echo "🔍 Running npm audit — dependency vulnerability scan..."
          npm audit --json > npm-audit-report.json || true
          npm audit --audit-level=high || {
            echo "::error::❌ Critical/High vulnerabilities found in npm dependencies. Review npm-audit-report.json for details."
            exit 1
          }
          echo "✅ No critical or high vulnerabilities detected in dependencies."

      # -- Upload npm audit report as artifact --------------------------------
      # Saves the JSON report for 14 days to enable:
      #   - Historical tracking of dependency vulnerabilities
      #   - Compliance auditing and evidence archival
      #   - Integration with external security dashboards
      # Runs even if the audit step fails (if: always())
      - name: Upload npm Audit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json
          retention-days: 14

      # -- Run ESLint to enforce code quality ---------------------------------
      # Executes ESLint twice:
      #   1. With JSON output for automated issue creation
      #   2. With console output for human-readable logs
      # The `|| true` prevents failure on lint errors (handled by continue-on-error)
      - name: Lint
        working-directory: ./frontend
        run: |
          npm run lint -- --format json --output-file eslint-report.json || true
          npm run lint
        continue-on-error: true

      # -- Upload ESLint report as artifact -----------------------------------
      # Saves the JSON report for 7 days to enable:
      #   - Automated issue creation from the report
      #   - Manual inspection and debugging
      #   - Historical analysis of code quality trends
      # Runs even if linting fails (if: always())
      - name: Upload ESLint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-report
          path: frontend/eslint-report.json
          retention-days: 7
      
      # -- Prepare environment for automated issue creation -------------------
      # Installs @octokit/rest library needed to interact with GitHub API.

      - name: Install Octokit for Issue Creation
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: npm install @octokit/rest
      
      # -- Create GitHub Issues from ESLint violations ------------------------
      # Executes the automation script that:
      #   1. Reads eslint-report.json generated in the Lint step
      #   2. Parses errors and warnings with file/line context
      #   3. Checks for existing open issues to avoid duplicates
      #   4. Creates new issues with professional formatting
      # 
      # Only triggers on 'develop' branch to centralize issue tracking.
      # Environment variables provide context for issue descriptions.

      - name: Generate ESLint Issues
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node .github/scripts/create-eslint-issues.js

      # -- Run Unit & Integration Tests + Enforce 70% Coverage ----------------
      # Uses Vitest and React Testing Library (via jsdom) to run both logic
      # unit tests and component integration tests.
      # Exits with a non-zero code if coverage drops below 70%.
      - name: Run Tests & Check Coverage
        working-directory: ./frontend
        run: npx vitest run --coverage --coverage.lines=70 --coverage.functions=70 --coverage.branches=70 --coverage.statements=70

      # -- Upload coverage report even on failure for debugging ---------------
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 3

  # ========================================================================
  # JOB 2 — E2E TESTS (POM Page Factory + Cucumber)
  # ========================================================================
  # Runs the Selenium-based E2E test suite using the POM Page Factory
  # pattern with Cucumber Gherkin scenarios.
  #
  # Test Flow:
  #   1. Checkout code and setup Node.js + JDK
  #   2. Build React frontend (production-ready build)
  #   3. Start Vite dev server (serves built app on http://localhost:5173)
  #   4. Wait for frontend availability with robust health checks
  #   5. Run E2E Cucumber tests with Selenium + Chrome
  #   6. Upload test reports for analysis
  #
  # Covers:
  #   - US-012: Kudos listing (filters, pagination, sorting, empty/error states)
  #   - Kudo sending (form, avatar preview, categories, server errors)
  #   - Navigation (Landing ↔ List ↔ Send page transitions)
  #
  # Quality gate: deploy is blocked if any E2E scenario fails.
  #
  # IMPORTANT: No Docker is used here. Frontend runs natively via npm.
  # ========================================================================
  e2e-tests:
    name: "🎭 E2E Tests — POM Page Factory"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ────────────────────────────────────────────────────────────────────
      # 1. SETUP: Checkout and install tools
      # ────────────────────────────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Node.js with npm caching (for frontend build + dev server)
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Setup JDK for Gradle/Cucumber tests
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Install chrome browser for Selenium tests
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'stable'

      # Install matching ChromeDriver for the installed Chrome version
      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v2
        with:
          chromedriver-version: 'matching'

      # Install OS-level dependencies required for headless Chrome
      - name: Install dependencies
        run: sudo apt-get install -y fonts-liberation libappindicator3-1 xdg-utils

      # ────────────────────────────────────────────────────────────────────
      # 2. FRONTEND: Build and start dev server
      # ────────────────────────────────────────────────────────────────────
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: ./frontend
        run: |
          echo "🔨 Building React application..."
          npm run build
          if [ -d "dist" ]; then
            echo "✅ Build successful. dist/ directory created:"
            ls -lh dist/ | head -5
          else
            echo "❌ Build failed. dist/ directory not found!"
            exit 1
          fi
        env:
          VITE_LOG_LEVEL: info

      - name: Start Frontend Dev Server
        working-directory: ./frontend
        run: |
          echo "🚀 Starting Vite preview server on http://localhost:5173..."
          nohup npx vite preview --port 5173 --host 0.0.0.0 > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          echo "📌 Preview PID: $(cat /tmp/preview.pid)"
          sleep 3
          echo "Checking if server started (preview.log):"
          head -20 /tmp/preview.log || echo "(log file not yet created)"

      # ────────────────────────────────────────────────────────────────────
      # 3. HEALTH CHECK: Verify frontend is ready
      # ────────────────────────────────────────────────────────────────────
      - name: Wait for Frontend to be Ready
        run: |
          echo "⏳ Waiting for frontend at http://localhost:5173..."
          MAX_ATTEMPTS=60
          RETRY_INTERVAL=2

          for i in $(seq 1 $MAX_ATTEMPTS); do
            if timeout 5 curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "✅ Frontend is ready and responsive at attempt $i"
              exit 0
            fi
            echo "  Attempt $i/$MAX_ATTEMPTS — retrying in ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
          done

          echo ""
          echo "❌ Frontend did not start within $((MAX_ATTEMPTS * RETRY_INTERVAL)) seconds"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "DEBUGGING INFORMATION:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "1️⃣  Checking if npm preview process is running..."
          if [ -f /tmp/preview.pid ]; then
            PID=$(cat /tmp/preview.pid)
            if ps -p $PID > /dev/null 2>&1; then
              echo "   ✅ Process $PID is still running"
            else
              echo "   ❌ Process $PID crashed or exited"
            fi
          else
            echo "   ❌ PID file not found"
          fi
          echo ""
          echo "2️⃣  Preview server output log (/tmp/preview.log):"
          tail -30 /tmp/preview.log 2>/dev/null || echo "   (Log file not found)"
          echo ""
          echo "3️⃣  Checking port 5173 listening status..."
          netstat -tlnp 2>/dev/null | grep 5173 || echo "   (No process listening on 5173)"
          echo ""
          echo "4️⃣  All Node processes running:"
          ps aux | grep -i node | grep -v grep || echo "   (No Node processes found)"
          exit 1
        timeout-minutes: 3

      # ────────────────────────────────────────────────────────────────────
      # 4. E2E TESTS: Run Cucumber tests with Gradle
      # ────────────────────────────────────────────────────────────────────
      - name: Grant Execute Permission for Gradle Wrapper
        working-directory: ./pom-pagefactory
        run: chmod +x gradlew 2>/dev/null || true

      - name: Run E2E Cucumber Tests with Serenity
        working-directory: ./pom-pagefactory
        run: |
          echo "🧪 Starting E2E Cucumber tests with Serenity..."
          echo "═══════════════════════════════════════════════════════════════"
          echo "Frontend: http://localhost:5173"
          echo "Browser: Edge (default) or Chrome (if BROWSER=chrome)"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          
          CHROMEDRIVER_PATH=$(which chromedriver)
          echo "ChromeDriver path: $CHROMEDRIVER_PATH"
          
          ./gradlew clean test aggregate \
            --no-daemon \
            -Dbase.url=http://localhost:5173 \
            -Dwebdriver.wait=10 \
            -Dwebdriver.chrome.driver="$CHROMEDRIVER_PATH"
            
          EXIT_CODE=$?
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ All E2E tests passed!"
          else
            echo "⚠️  Tests completed with failures or errors"
            echo "📊 Report: target/site/serenity/index.html"
          fi
          echo "═══════════════════════════════════════════════════════════════"
          exit $EXIT_CODE
        env:
          BROWSER: chrome
        continue-on-error: false

      # ────────────────────────────────────────────────────────────────────
      # 5. REPORTING: Upload test artifacts and Serenity reports
      # ────────────────────────────────────────────────────────────────────
      - name: Upload Serenity E2E Report (Primary)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serenity-e2e-report
          path: pom-pagefactory/target/site/serenity/
          retention-days: 30
      
      - name: Upload Cucumber E2E Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-e2e-report
          path: pom-pagefactory/build/reports/cucumber.html
          retention-days: 30

      - name: Upload JUnit E2E Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-junit-results
          path: pom-pagefactory/build/test-results/test/
          retention-days: 30

      - name: Upload Gradle Build Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gradle-build-logs
          path: pom-pagefactory/build/logs/
          retention-days: 7
      
      - name: Display Test Execution Summary
        if: always()
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║               E2E TEST EXECUTION SUMMARY                        ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "📋 Available Reports:"
          echo "  • Serenity Report:  pom-pagefactory/target/site/serenity/"
          echo "  • Cucumber Report:  pom-pagefactory/build/reports/cucumber.html"
          echo "  • JUnit Results:    pom-pagefactory/build/test-results/test/"
          echo ""
          echo "📊 Report Details:"
          if [ -d "pom-pagefactory/target/site/serenity" ]; then
            SERENITY_DIR=$(find pom-pagefactory/target/site/serenity -name "index.html" | head -1)
            if [ -n "$SERENITY_DIR" ]; then
              echo "  ✅ Serenity report generated successfully"
              echo "     Open: pom-pagefactory/target/site/serenity/index.html"
            fi
          fi
          echo ""
          echo "👉 Next Steps:"
          echo "  1. Download the 'serenity-e2e-report' artifact"
          echo "  2. Extract and open 'index.html' in your browser"
          echo "  3. Review test execution timeline, screenshots, and failure details"
          echo ""
