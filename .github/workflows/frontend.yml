# ==============================================================================
# FRONTEND CI/CD WORKFLOW
#
# PURPOSE:
#   Independent pipeline for the frontend React application.
#   Runs linting & unit tests, builds the Docker image, and deploys to AWS EC2.
#
# DESIGN DECISIONS:
#   - Isolated from backend — only triggers when frontend code changes
#   - Uses `!` negation patterns to skip doc/non-code file changes
#   - Lint step catches style issues early before tests run
#   - Docker image uses multi-stage build (Node builder → Nginx runtime)
#   - Deploy updates only the frontend container, leaving backend untouched
# ==============================================================================

name: Frontend CI/CD

# ──────────────────────────────────────────────────────────────────────────────
# PERMISSIONS
# ──────────────────────────────────────────────────────────────────────────────
# Required for creating issues automatically from ESLint results
permissions:
  contents: read       # Read repository code
  issues: write        # Create and update issues
  pull-requests: read  # Read PR info (optional)

# ──────────────────────────────────────────────────────────────────────────────
# TRIGGERS
# ──────────────────────────────────────────────────────────────────────────────
# Runs on push/PR to main, develop, and feature/** branches.
# Only triggers when frontend CODE files are modified.
#
# The `!` negation patterns ensure that documentation and non-code files
# (.md, .txt, .pdf, images, logs) do NOT trigger this workflow,
# even if those files are inside the frontend/ directory.
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      # ── Exclude documentation / non-code files ──
      - "!**/*.md"
      - "!**/*.txt"
      - "!**/*.pdf"
      - "!**/*.png"
      - "!**/*.jpg"
      - "!**/*.jpeg"
      - "!**/*.gif"
      - "!**/*.svg"
      - "!**/*.log"

  pull_request:
    branches:
      - main
      - develop
      - "feature/**"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      # ── Exclude documentation / non-code files ──
      - "!**/*.md"
      - "!**/*.txt"
      - "!**/*.pdf"
      - "!**/*.png"
      - "!**/*.jpg"
      - "!**/*.jpeg"
      - "!**/*.gif"
      - "!**/*.svg"
      - "!**/*.log"

# ──────────────────────────────────────────────────────────────────────────────
# GLOBAL ENVIRONMENT VARIABLES
# ──────────────────────────────────────────────────────────────────────────────
env:
  NODE_VERSION: '20'
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USER }}/sofkianos-frontend

jobs:
  # ========================================================================
  # JOB 1 — TEST & LINT
  # ========================================================================
  # Runs ESLint for code quality and Vitest for unit tests.
  # If ANY check fails the workflow stops → merge is blocked
  # (when branch protection rules require this check to pass).
  # ========================================================================
  test:
    name: "🧪 Frontend Tests & Lint"
    runs-on: ubuntu-latest

    steps:
      # -- Checkout source code -----------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # -- Setup Node.js with npm dependency caching -------------------------
      # Caches the npm store to avoid re-downloading dependencies each run.
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      # -- Install exact dependency versions from lockfile --------------------
      # `npm ci` is faster than `npm install` and guarantees reproducibility.
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install

      # -- Run ESLint to enforce code quality ---------------------------------
      # Executes ESLint twice:
      #   1. With JSON output for automated issue creation
      #   2. With console output for human-readable logs
      # The `|| true` prevents failure on lint errors (handled by continue-on-error)
      - name: Lint
        working-directory: ./frontend
        run: |
          npm run lint -- --format json --output-file eslint-report.json || true
          npm run lint
        continue-on-error: true

      # -- Upload ESLint report as artifact -----------------------------------
      # Saves the JSON report for 7 days to enable:
      #   - Automated issue creation from the report
      #   - Manual inspection and debugging
      #   - Historical analysis of code quality trends
      # Runs even if linting fails (if: always())
      - name: Upload ESLint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-report
          path: frontend/eslint-report.json
          retention-days: 7

      # ========================================================================
      # TESTING: Create Sample Issue (Remove after testing)
      # ========================================================================
      # This is a TEST STEP to verify that issue creation works correctly
      # before integrating with the real ESLint report.
      # 
      # USAGE:
      #   1. Push to any branch to trigger this workflow
      #   2. Verify that a test issue is created in GitHub Issues
      #   3. Once confirmed, comment this step and uncomment the real ones below
      # ========================================================================
      - name: "[TEST] Create Sample ESLint Issue"
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SHORT_SHA=${SHORT_SHA:0:7}
          
          # Create JSON payload using jq with multiline body
          jq -n \
            --arg title "[LINT] [TEST] no-unused-vars in src/components/TestComponent.tsx" \
            --arg body "## 🚨 ESLint Violation Detected

          **File:** \`src/components/TestComponent.tsx:42\`  
          **Rule:** [\`no-unused-vars\`](https://eslint.org/docs/latest/rules/no-unused-vars)  
          **Severity:** Error

          ### 📝 Error Message
          > 'testVariable' is assigned a value but never used.

          ### 🛠 Automated Context
          - **Commit:** [\`$SHORT_SHA\`](https://github.com/$REPO/commit/$GITHUB_SHA)
          - **Author:** @$ACTOR
          - **Branch:** \`$BRANCH\`
          - **Workflow Run:** [View Logs](https://github.com/$REPO/actions/runs/$RUN_ID)

          ### 🔍 Code Context
          \`\`\`typescript
          // src/components/TestComponent.tsx:42
             40 | function TestComponent() {
             41 |   const [data, setData] = useState();
          →  42 |   const testVariable = \"unused\";
             43 |   return <div>{data}</div>
             44 | }
          \`\`\`

          ---
          _⚠️ **THIS IS A TEST ISSUE** - This issue was automatically generated to test the CI/CD workflow._" \
            --argjson labels '["eslint", "code-quality", "priority-high", "bug", "test"]' \
            '{title: $title, body: $body, labels: $labels}' > /tmp/issue_payload.json
          
          # Create issue via GitHub API
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/$REPO/issues \
            -d @/tmp/issue_payload.json)
          
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_STATUS" -eq 201 ]; then
            ISSUE_NUMBER=$(echo "$RESPONSE_BODY" | jq -r '.number')
            ISSUE_URL=$(echo "$RESPONSE_BODY" | jq -r '.html_url')
            echo "✅ Test issue #$ISSUE_NUMBER created successfully!"
            echo "📎 URL: $ISSUE_URL"
          else
            echo "❌ Failed to create issue. HTTP Status: $HTTP_STATUS"
            echo "Response: $RESPONSE_BODY"
            exit 1
          fi

      # ========================================================================
      # PRODUCTION: Real ESLint Issue Creation (Currently commented for testing)
      # ========================================================================
      # Uncomment these steps after verifying the test issue works correctly
      # ========================================================================
      
      # -- Prepare environment for automated issue creation -------------------
      # Installs @octokit/rest library needed to interact with GitHub API.

      # - name: Install Octokit for Issue Creation
      #   if: always() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
      #   working-directory: ./frontend
      #   run: npm install @octokit/rest
      
      # -- Create GitHub Issues from ESLint violations ------------------------
      # Executes the automation script that:
      #   1. Reads eslint-report.json generated in the Lint step
      #   2. Parses errors and warnings with file/line context
      #   3. Checks for existing open issues to avoid duplicates
      #   4. Creates new issues with professional formatting
      # 
      # Only triggers on 'develop' branch to centralize issue tracking.
      # Environment variables provide context for issue descriptions.

      # - name: Generate ESLint Issues
      #   if: always() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     GITHUB_REPOSITORY: ${{ github.repository }}
      #     GITHUB_SHA: ${{ github.sha }}
      #     GITHUB_REF_NAME: ${{ github.ref_name }}
      #     GITHUB_ACTOR: ${{ github.actor }}
      #     GITHUB_RUN_ID: ${{ github.run_id }}
      #   run: node ../.github/scripts/create-eslint-issues.js

      # -- Run Vitest unit tests ----------------------------------------------
      # Script "test:unit" is defined as "vitest run" in package.json
      - name: Run Unit Tests
        working-directory: ./frontend
        run: npm run test:unit

      # -- Upload coverage report even on failure for debugging ---------------
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 3

  # ========================================================================
  # JOB 2 — DOCKER BUILD & PUSH
  # ========================================================================
  # Builds the frontend Docker image using the multi-stage Dockerfile
  # (Node 20 builder → Nginx runtime), then pushes to Docker Hub.
  #
  # Only runs AFTER tests pass (`needs: test`) and only on push events
  # (not on PRs, to avoid pushing throwaway images).
  # ========================================================================
  docker-build:
    name: "🐳 Docker Build & Push"
    needs: [test]                       # Fail-fast: skip if tests fail
    # if: github.event_name == 'push'     # Don't push images for PRs
    # Se ejecuta siempre (incluso si 'test' falla) pero solo en eventos push
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -- Extract short SHA for tagging --------------------------------------
      # Generates a 7-character short SHA from the commit hash
      - name: Generate Short SHA
        id: short-sha
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      # -- Login to Docker Hub ------------------------------------------------
      # Requires repository secrets: DOCKER_USER and DOCKER_PASSWORD
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -- Setup Docker Buildx for layer caching ------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -- Build & push the frontend image ------------------------------------
      # Tags:
      #   - latest       → always points to the newest build
      #   - <short-sha>  → immutable 7-char tag tied to the commit for rollback
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.short-sha.outputs.sha_short }}
          cache-from: type=gha          # GitHub Actions cache for Docker layers
          cache-to: type=gha,mode=max

  # ========================================================================
  # JOB 3 — DEPLOY TO EC2
  # ========================================================================
  # SSHs into the AWS EC2 instance, pulls the latest frontend image,
  # and restarts only the frontend container.
  #
  # Only runs on pushes to `main` (production deploys).
  # Requires secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY.
  # ========================================================================
  deploy:
    name: "🚀 Deploy Frontend"
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'   # Deploy only from main branch
    runs-on: ubuntu-latest

    steps:
      # -- SSH into EC2 and update the frontend container ---------------------
      # Only the frontend container is restarted (--no-deps keeps backend
      # and RabbitMQ untouched).
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/sofkianos-mvp

            # Pull latest code (nginx.conf, docker-compose changes, etc.)
            git pull origin main

            # Pull the freshly built Docker image
            docker pull ${{ env.FRONTEND_IMAGE }}:latest

            # Restart only the frontend container (zero-downtime for backend)
            docker-compose -f docker-compose.prod.yml up -d \
              --no-deps --force-recreate frontend

            # Show running containers for verification
            docker-compose -f docker-compose.prod.yml ps
