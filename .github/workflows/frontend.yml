name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
    paths:
      - "frontend/**"
      - "src/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/frontend.yml"
      - "!**/*.md"
      - "!**/*.txt"
      - "!**/*.pdf"
      - "!**/*.png"
      - "!**/*.jpg"
      - "!**/*.jpeg"
      - "!**/*.gif"
      - "!**/*.svg"
      - "!**/*.log"

  pull_request:
    branches:
      - main
      - develop
      - "feature/**"
    paths:
      - "frontend/**"
      - "src/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/frontend.yml"
      - "!**/*.md"
      - "!**/*.txt"
      - "!**/*.pdf"
      - "!**/*.png"
      - "!**/*.jpg"
      - "!**/*.jpeg"
      - "!**/*.gif"
      - "!**/*.svg"
      - "!**/*.log"

env:
  NODE_VERSION: "20"
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USER }}/sofkianos-frontend

jobs:
  e2e-tests:
    name: "🎭 E2E Tests — POM Page Factory"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Frontend Source
        id: frontend_source
        shell: bash
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            echo "frontend_dir=frontend" >> "$GITHUB_OUTPUT"
            if [ -f "frontend/package-lock.json" ]; then
              echo "has_lockfile=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_lockfile=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Local ./frontend not found. Cloning AUT repository..."
            git clone --depth 1 https://github.com/ElyRiven/sofkianos-mvp.git aut-repo
            if [ ! -d "aut-repo/frontend" ] || [ ! -f "aut-repo/frontend/package.json" ]; then
              echo "::error::Frontend path not found in either current repository or cloned AUT repository."
              echo "Workspace root contents:"
              ls -la
              exit 1
            fi
            echo "frontend_dir=aut-repo/frontend" >> "$GITHUB_OUTPUT"
            if [ -f "aut-repo/frontend/package-lock.json" ]; then
              echo "has_lockfile=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_lockfile=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Show Resolved Frontend Path
        shell: bash
        run: |
          echo "Resolved frontend_dir=${{ steps.frontend_source.outputs.frontend_dir }}"
          ls -la "${{ steps.frontend_source.outputs.frontend_dir }}"

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        if: steps.frontend_source.outputs.has_lockfile == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ steps.frontend_source.outputs.frontend_dir }}/package-lock.json

      - name: Set up Node.js ${{ env.NODE_VERSION }} (no cache fallback)
        if: steps.frontend_source.outputs.has_lockfile != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: "stable"

      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install dependencies
        run: sudo apt-get install -y fonts-liberation libappindicator3-1 xdg-utils

      - name: Install Frontend Dependencies
        working-directory: ${{ steps.frontend_source.outputs.frontend_dir }}
        shell: bash
        run: |
          if [ "${{ steps.frontend_source.outputs.has_lockfile }}" = "true" ]; then
            echo "Lockfile found. Running npm ci..."
            npm ci
          else
            echo "No package-lock.json found. Falling back to npm install..."
            npm install --no-audit --no-fund
          fi

      - name: Build Frontend Application
        working-directory: ${{ steps.frontend_source.outputs.frontend_dir }}
        run: |
          npm run build
          if [ ! -d "dist" ]; then
            exit 1
          fi
        env:
          VITE_LOG_LEVEL: info

      - name: Start Frontend Dev Server
        working-directory: ${{ steps.frontend_source.outputs.frontend_dir }}
        run: |
          nohup npx vite preview --port 5173 --host 0.0.0.0 > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          sleep 3
          head -20 /tmp/preview.log || true

      - name: Wait for Frontend to be Ready
        run: |
          MAX_ATTEMPTS=60
          RETRY_INTERVAL=2
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if timeout 5 curl -sf http://localhost:5173 > /dev/null 2>&1; then
              exit 0
            fi
            sleep $RETRY_INTERVAL
          done
          if [ -f /tmp/preview.log ]; then
            tail -30 /tmp/preview.log
          fi
          exit 1
        timeout-minutes: 3

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew 2>/dev/null || true

      - name: Run E2E Cucumber Tests with Serenity
        run: |
          ./gradlew clean test aggregate \
            --no-daemon \
            -Dbrowser=chrome \
            -Dheadless.mode=true \
            -Dbase.url=http://localhost:5173 \
            -Dwebdriver.wait=10
        env:
          BROWSER: chrome

      - name: Verify Cucumber Report Files
        if: always()
        shell: bash
        run: |
          if [ ! -d "target/cucumber-report" ]; then
            echo "::error::Cucumber report directory not found at target/cucumber-report"
            exit 1
          fi
          CUCUMBER_FILES_COUNT=$(find target/cucumber-report -type f -name "*.json" | wc -l | tr -d ' ')
          echo "Detected Cucumber report files: ${CUCUMBER_FILES_COUNT}"
          if [ "${CUCUMBER_FILES_COUNT}" -eq 0 ]; then
            echo "::error::No Cucumber report files were generated."
            exit 1
          fi

      - name: Upload Serenity E2E Report (Primary)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serenity-e2e-report
          path: target/site/serenity/
          retention-days: 30

      - name: Upload Cucumber E2E Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-e2e-report
          path: target/cucumber-report/
          retention-days: 30

      - name: Upload JUnit E2E Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-junit-results
          path: build/test-results/test/
          retention-days: 30

      - name: Upload Gradle Build Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gradle-build-logs
          path: build/logs/
          retention-days: 7

      - name: Display Test Execution Summary
        if: always()
        run: |
          if [ -d "target/site/serenity" ]; then
            find target/site/serenity -name "index.html" | head -1 || true
          fi
