name: Issue Classifier

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  classify-issue:
    name: Classify & Label Issue
    runs-on: ubuntu-latest
    steps:
      - name: Apply Labels Based on Issue Title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title;
            const labelMap = [
              { prefix: '[Bug]:',        labels: ['bug'] },
              { prefix: '[Tech Debt]:',  labels: ['tech-debt'] },
              { prefix: '[Security]:',   labels: ['security', 'critical'] },
            ];
            const match = labelMap.find(({ prefix }) => title.startsWith(prefix));
            if (match) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: match.labels,
              });
            }
