name: 🔧 Technical Debt / Known Limitation
description: Track a known technical limitation, architectural gap, or maintenance debt.
title: "[Tech Debt]: "
labels: ["tech-debt"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🔧 Technical Debt / Known Limitation
        Use this template to document known limitations, architectural gaps, or areas that need
        refactoring. These are not necessarily bugs — they are intentional shortcuts or design
        decisions that should be addressed in a future sprint.

  - type: textarea
    id: description
    attributes:
      label: "📋 Description"
      description: >
        Context of the limitation and where it was identified (component, layer, service).
      placeholder: |
        Describe the technical limitation or debt, which component/service is affected,
        and how it was identified (e.g., code review, audit, production incident).
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "🔁 Steps to Reproduce / Observe the Problem"
      description: How can someone observe this limitation in the codebase or at runtime?
      placeholder: |
        1. Open file ...
        2. Review method / component ...
        3. Observe the limitation: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "✅ Expected Behaviour / Desired State"
      description: What should the correct implementation look like?
      placeholder: "Ideally, the system should ..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "❌ Current Behaviour / Actual State"
      description: What is the current behaviour that needs to change?
      placeholder: "Currently, the system ..."
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "🚨 Severity Level"
      description: What is the impact of leaving this debt unaddressed?
      options:
        - "🔴 Critical — Blocks production readiness or causes data integrity issues"
        - "🟠 Major — Significantly limits scalability, security, or maintainability"
        - "🟡 Minor — Increases maintenance burden but does not block functionality"
        - "🟢 Enhancement — Nice-to-have improvement with low urgency"
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: "🔍 Validation"
      description: >
        Evidence that this debt exists — code locations, audit results, metrics, or test findings.
      placeholder: |
        Confirmed by: (e.g., code audit, QA review, production log analysis)
        Location: (file path, class, method, line number)
        Evidence: (ESLint warning, coverage report, benchmark result)
    validations:
      required: true

  - type: input
    id: affected_files
    attributes:
      label: "📁 Affected Files / Components"
      description: List the main files or components related to this debt.
      placeholder: "e.g., frontend/src/store/userStore.ts, consumer-worker/.../KudoConsumer.java"
    validations:
      required: false

  - type: input
    id: timeline
    attributes:
      label: "📅 Suggested Timeline"
      description: When should this be addressed? (e.g., Q1 2026, before UAT, next sprint)
      placeholder: "e.g., Q1 2026 — critical for MVP"
    validations:
      required: false

  - type: textarea
    id: proposed_solution
    attributes:
      label: "💡 Proposed Solution"
      description: Describe the recommended approach to resolve this debt.
      placeholder: |
        1. Create / modify ...
        2. Replace ... with ...
        3. Add tests for ...
    validations:
      required: false
