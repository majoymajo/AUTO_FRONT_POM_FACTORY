name: 🐛 Bug Report
description: Report a defect found during testing or production usage.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Report
        Please fill out every section carefully so the team can reproduce and fix the issue quickly.

  - type: textarea
    id: description
    attributes:
      label: "📋 Description"
      description: >
        Context of the problem and where it was found (environment, component, feature area).
      placeholder: |
        Describe the bug, which component/service is affected, and how it was discovered
        (e.g., manual testing, automated test, production monitoring).
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "🔁 Steps to Reproduce"
      description: Provide an exact numbered list of steps to replicate the issue.
      placeholder: |
        1. Navigate to ...
        2. Click / fill in ...
        3. Observe the result
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "✅ Expected Results"
      description: What should happen if the system works correctly?
      placeholder: "The system should ..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "❌ Actual Results"
      description: What actually happens when following the steps above?
      placeholder: "Instead, the system ..."
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "🚨 Severity Level"
      description: How severe is the impact of this bug?
      options:
        - "🔴 Critical — System crash, data loss, security breach, or complete feature failure"
        - "🟠 Major — Core functionality broken, no workaround available"
        - "🟡 Minor — Feature partially broken, workaround exists"
        - "🟢 Enhancement — Improvement or cosmetic issue"
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: "🔍 Validation"
      description: >
        How was this issue confirmed? Include environment details, test data used,
        or screenshots/logs that support the finding.
      placeholder: |
        Confirmed by: (e.g., manual testing, automated test, code review)
        Environment: (e.g., local, staging, production)
        Additional evidence: (logs, screenshots, test case name)
    validations:
      required: true

  - type: input
    id: affected_files
    attributes:
      label: "📁 Affected Files / Components"
      description: List the main files or components related to this bug.
      placeholder: "e.g., frontend/src/hooks/forms/useKudoForm.ts"
    validations:
      required: false

  - type: textarea
    id: proposed_solution
    attributes:
      label: "💡 Proposed Solution (optional)"
      description: If you have a suggestion for how to fix this issue, describe it here.
      placeholder: "Consider changing ..."
    validations:
      required: false
