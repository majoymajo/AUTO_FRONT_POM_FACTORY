name: 🔴 Security Issue
description: Report a security vulnerability or risk (credentials, auth bypass, injection, etc.).
title: "[Security]: "
labels: ["security", "critical"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🔴 Security Issue
        > ⚠️ **IMPORTANT**: If this vulnerability is actively exploitable in production, please
        > rotate the affected credentials or disable the affected endpoint **before** opening
        > this issue, and notify the security lead directly.

        Use this template to document security vulnerabilities, exposed credentials, missing
        authentication/authorization, or other security risks discovered during review or testing.

  - type: textarea
    id: description
    attributes:
      label: "📋 Description"
      description: >
        Context of the vulnerability: what was found, where it is located, and how it was discovered.
        Do NOT paste actual secret values here — use placeholders like `[REDACTED]`.
      placeholder: |
        A [type of vulnerability] was found in [component/file].
        It was discovered during [code review / audit / penetration test / automated scan].
        Affected service: [producer-api / consumer-worker / frontend / infrastructure]
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "🔁 Steps to Reproduce / Verify"
      description: How can the security team confirm this vulnerability exists?
      placeholder: |
        1. Open file / endpoint ...
        2. Observe ...
        3. An attacker could ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "✅ Expected (Secure) Behaviour"
      description: What should the correct, secure implementation look like?
      placeholder: "Credentials should be stored in environment variables, not source code."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "❌ Actual (Vulnerable) Behaviour"
      description: What is the current insecure state?
      placeholder: "The file currently contains plaintext credentials committed to the repository."
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "🚨 Severity Level"
      description: >
        Rate the severity based on exploitability and potential impact.
      options:
        - "🔴 Critical — Immediate exploit risk: exposed secrets, RCE, auth bypass, data breach"
        - "🟠 Major — High risk requiring urgent action before next release"
        - "🟡 Minor — Low immediate risk but should be addressed soon"
        - "🟢 Enhancement — Hardening / defence-in-depth improvement"
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: "🔍 Validation"
      description: >
        How was this confirmed? Include tool output, scan results, or code references.
        Do NOT include actual secret values.
      placeholder: |
        Confirmed by: (e.g., manual code review, CodeQL scan, secret scanning alert)
        Environment: (e.g., source code, staging config, docker-compose)
        Evidence: (file path, line number, tool alert ID — no actual secrets)
    validations:
      required: true

  - type: textarea
    id: immediate_action
    attributes:
      label: "⚡ Immediate Actions Required"
      description: What must be done right now to mitigate the risk?
      placeholder: |
        1. Rotate affected credentials immediately
        2. Remove secret from git history (git filter-repo / BFG)
        3. Update .gitignore to prevent future exposure
    validations:
      required: false

  - type: input
    id: affected_files
    attributes:
      label: "📁 Affected Files / Components"
      description: List files or components where the vulnerability exists.
      placeholder: "e.g., consumer-worker/src/main/resources/application.properties"
    validations:
      required: false

  - type: textarea
    id: proposed_solution
    attributes:
      label: "💡 Proposed Long-Term Solution"
      description: What is the recommended permanent fix?
      placeholder: |
        1. Move credentials to environment variables / secrets manager
        2. Add pre-commit hook to detect secrets (e.g., git-secrets, trufflehog)
        3. Enable GitHub secret scanning on the repository
    validations:
      required: false
